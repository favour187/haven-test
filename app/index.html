<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/haven-test/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Haven — a calm, private daily-life companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Haven">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Haven</title>
  <link rel="manifest" href="manifest.json">
  <!-- Visible immediately, before the Flutter engine has loaded. -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f7f8fa; color: #20272d;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease;
    }
    #boot .ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 4px solid #cdd5dc; border-top-color: #486274;
      animation: spin 1.1s linear infinite; margin-bottom: 18px;
    }
    #boot .t { font-size: 1.5rem; font-weight: 700; }
    #boot .s { margin-top: 8px; color: #48545f; font-size: 1rem; text-align: center; padding: 0 24px; max-width: 28rem; line-height: 1.5; }
    #boot button {
      margin-top: 22px; padding: 12px 20px; min-height: 48px;
      border: 2px solid #486274; border-radius: 14px;
      background: #486274; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    #boot button:focus-visible { outline: 3px solid #20272d; outline-offset: 3px; }
    #boot [hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot { transition: none; }
      #boot .ring { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Chromium on Linux can expose a POSIX value such as "en-US@posix".
    // The web engine passes navigator.languages to Intl.Locale, which rejects
    // that value before Haven can start. Keep valid browser locales untouched;
    // otherwise remove the POSIX modifier and use a safe fallback.
    (function () {
      function isValidLocale(value) {
        try { new Intl.Locale(value); return true; } catch (_) { return false; }
      }
      var original = Array.from(navigator.languages || [navigator.language || 'en-US']);
      if (original.every(isValidLocale)) return;
      var normalized = original.map(function (value) {
        var base = String(value).split('@')[0].replace(/_/g, '-');
        return isValidLocale(base) ? base : 'en-US';
      }).filter(function (value, index, values) {
        return values.indexOf(value) === index;
      });
      Object.defineProperty(navigator, 'languages', {
        configurable: true,
        get: function () { return normalized; }
      });
      Object.defineProperty(navigator, 'language', {
        configurable: true,
        get: function () { return normalized[0]; }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <div id="boot">
    <div class="ring" aria-hidden="true"></div>
    <div class="t">Haven</div>
    <div class="s" id="boot-status" role="status" aria-live="polite">Loading your space. This may take a moment.</div>
    <button id="boot-retry" type="button" hidden>Reload Haven</button>
  </div>
  <script>
    // Flutter can paint inside nested shadow roots. Keep the loading message
    // until the app appears; if it takes too long, offer a clear retry instead
    // of removing the overlay and leaving a blank screen.
    (function () {
      function canvasPainted() {
        if (document.querySelector('canvas')) return true;
        var gp = document.querySelector('flt-glass-pane');
        if (gp && gp.shadowRoot && gp.shadowRoot.querySelector('canvas')) return true;
        var v = document.querySelector('flutter-view');
        if (v && v.shadowRoot && v.shadowRoot.querySelector('canvas')) return true;
        return document.querySelectorAll('flt-glass-pane, flt-scene-host').length > 0;
      }
      var status = document.getElementById('boot-status');
      var retry = document.getElementById('boot-retry');
      retry.addEventListener('click', function () { window.location.reload(); });
      var ticks = 0;
      var timer = setInterval(function () {
        ticks++;
        if (canvasPainted()) {
          clearInterval(timer);
          var boot = document.getElementById('boot');
          if (boot) {
            boot.style.opacity = '0';
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            setTimeout(function () { boot.remove(); }, reduced ? 0 : 600);
          }
        } else if (ticks === 180) {
          status.textContent = 'Haven is taking longer than expected. Check your connection, then try again.';
          retry.hidden = false;
        }
      }, 500);
    })();
  </script>
</body>
</html>
