<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/haven-test/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Haven — a calm, private daily-life companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Haven">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>haven</title>
  <link rel="manifest" href="manifest.json">
  <!-- Boot loader: visible instantly, before any engine JS downloads. -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f4f7f9; color: #20303c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease;
    }
    #boot .ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 4px solid #dbe4ea; border-top-color: #4a6b8a;
      animation: spin 1.1s linear infinite; margin-bottom: 18px;
    }
    #boot .t { font-size: 1.5rem; font-weight: 700; }
    #boot .s { margin-top: 8px; color: #5c7285; font-size: .95rem; text-align: center; padding: 0 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <div id="boot">
    <div class="ring"></div>
    <div class="t">Haven</div>
    <div class="s">Loading — the first start can take up to a minute.<br>After that it opens quickly.</div>
  </div>
  <script>
    window.addEventListener('load', function () {
      var ticks = 0;
      var timer = setInterval(function () {
        ticks++;
        var view = document.querySelector('flutter-view');
        var painting = false;
        if (view) {
          var root = view.shadowRoot || view;
          painting = !!(root.querySelector('canvas') || root.querySelector('FLT-VIEW-CONTAINER'));
        }
        if (painting || ticks > 360) {
          clearInterval(timer);
          var boot = document.getElementById('boot');
          if (boot) {
            boot.style.opacity = '0';
            setTimeout(function () { boot.remove(); }, 600);
          }
        }
      }, 500);
    });
  </script>
</body>
</html>
